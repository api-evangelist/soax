aid: soax
name: SOAX
description: >-
  SOAX provides enterprise-grade proxy infrastructure and web data extraction APIs for developers and data teams. With
  155M+ residential IPs, 33M+ mobile IPs, and 300K+ datacenter IPs across 195+ countries, SOAX enables web scraping,
  CAPTCHA bypass, geo-targeted data collection, and anti-bot circumvention at scale. The Web Data API handles JavaScript
  rendering, session management, and headless browser automation automatically.
